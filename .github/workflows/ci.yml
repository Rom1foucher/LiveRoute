name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Core is intentionally testable without installing frontend dependencies:
      # its tests import only node:test, node:assert, and relative source paths.
      - name: Core tests
        run: npm run test:core

  quality:
    name: Format, types, and application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run build:web
        env:
          # Production is served from the verified custom domain, not /LiveRoute/.
          VITE_BASE_PATH: /
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
